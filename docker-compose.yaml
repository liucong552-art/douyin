services:
  app:
    image: ihmily/douyin-live-recorder:v4.0.7@sha256:1718173f28171963fb08ba1defa561886f1dc16576677992c094fff8a1fef064
    container_name: douyin-recorder
    environment:
      - TERM=xterm-256color
      - TZ=Asia/Shanghai
    tty: true
    stdin_open: true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./backup_config:/app/backup_config
      - ./downloads:/app/downloads
    restart: unless-stopped
